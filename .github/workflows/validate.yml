name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate skill package
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Run validator regression tests
        shell: pwsh
        run: ./tests/validate.Tests.ps1
